name: GuandanApp
options:
  bundleIdPrefix: com.yorick
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
knownRegions: [en, Base, zh-Hans, zh-Hant, ja, ko, es, fr, de, pt-BR, ru, ar, hi, id]
packages:
  GuandanCore:
    path: ../GuandanCore
targets:
  GuandanApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GuandanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yorick.guandan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "GuanDan!"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "2QP5BJXCZ6"
        CODE_SIGN_STYLE: Automatic
